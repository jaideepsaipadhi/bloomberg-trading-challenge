name: Momentum post

# Smart poster: posts a fresh book ONLY on a rebalance (~monthly), else a short
# weekly "no change" heartbeat (no data fetch). The book is remembered in
# state/book_state.json, committed back by this workflow.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   Telegram: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_IDS
# Without them it runs in console mode (sends nothing) — safe to merge.

on:
  schedule:
    - cron: "0 13 * * 1-5"      # weekdays 13:00 UTC (~8-9am ET)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Force console output (no send, no state write)"
        type: boolean
        default: false

permissions:
  contents: write              # to commit the updated book state

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Post (rebalance or heartbeat)
        env:
          NOTIFY_PROVIDER: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && 'telegram' || (secrets.TWILIO_ACCOUNT_SID != '' && 'twilio' || 'console') }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            trading-bot post --dry-run
          else
            trading-bot post
          fi
      - name: Commit updated state
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "trading-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Update book state [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
